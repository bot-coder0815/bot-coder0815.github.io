<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Portfolio eines Entwicklers – Web- & Software-Entwicklung, Minecraft-Modifikationen und mehr." />
  <meta name="theme-color" content="#2563eb" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
  <title>DevCoder · Portfolio</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== Navigationsleiste ===== -->
  <header class="nav" id="nav">
    <a href="#home" class="nav__logo" id="logo"></a>

    <nav class="nav__links" id="navLinks" aria-label="Hauptnavigation">
      <!-- Links werden von app.js generiert -->
    </nav>

    <div class="nav__right">
      <!-- Sprachumschalter (Optionen aus data.js) -->
      <div class="lang" id="langSwitch" role="group" aria-label="Sprache wählen"></div>
      <!-- Dark-Mode-Schalter -->
      <button class="theme" id="themeToggle" aria-label="Dark Mode umschalten" aria-pressed="false">
        <span class="theme__icon theme__icon--sun">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M19.8 4.2l-1.6 1.6M5.8 18.2l-1.6 1.6"/></svg>
        </span>
        <span class="theme__icon theme__icon--moon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </span>
      </button>
      <!-- Mobile-Menü-Button -->
      <button class="nav__toggle" id="navToggle" aria-label="Menü öffnen">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ===== Hero ===== -->
  <section class="hero" id="home">
    <div class="hero__mesh"></div>
    <div class="container hero__inner" id="hero"></div>
  </section>

  <!-- ===== Sektionen (Inhalte werden aus data.js gerendert) ===== -->
  <main>
    <section class="section" id="about" data-hidden></section>
    <section class="section section--alt" id="skills" data-hidden></section>
    <section class="section" id="work" data-hidden></section>
    <section class="section section--alt" id="career" data-hidden></section>
    <section class="section" id="minecraft" data-hidden></section>
    <section class="section section--alt" id="license" data-hidden></section>
    <section class="section" id="contact" data-hidden></section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container">
      <span class="footer__logo" id="footerLogo"></span>
      <p id="footerLine"></p>
    </div>
  </footer>

  <!-- Sozial/Utility -->
  <button class="to-top" id="toTop" aria-label="Zurück nach oben">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
  </button>

  <!-- Daten & Logik (Reihenfolge wichtig: erst data.js, dann app.js) -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
